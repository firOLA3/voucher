services:
  - type: web
    name: convocation-voucher-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: VOUCHER_ADMIN_PASSWORD
        sync: false
      - key: VOUCHER_SESSION_SECRET
        generateValue: true
      - key: VOUCHER_COOKIE_SAMESITE
        value: none
      - key: VOUCHER_COOKIE_SECURE
        value: "1"
